[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefem-viewer"
version = "0.1.0"
description = "Standalone desktop viewer for WaveFEM HDF5 results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "WaveFEM contributors" },
]
dependencies = [
    "numpy>=1.26,<3",
    "h5py>=3.15,<4",
    "matplotlib>=3.8,<4",
]

[project.scripts]
wavefem-viewer = "wavefem_viewer.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
