[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-mode-solver"
version = "0.1.0"
description = "Standalone finite-element waveguide mode solvers"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-fem>=12,<13",
    "gmsh>=4.13,<5",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
fem-transmission-line = "FEM_Mode_Solver.transmission_lines.gui:main"

[tool.setuptools]
packages = [
    "FEM_Mode_Solver",
    "FEM_Mode_Solver.examples",
    "FEM_Mode_Solver.transmission_lines",
]
package-dir = {FEM_Mode_Solver = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gmsh: test requiring the Gmsh runtime",
    "slow: convergence test or comparatively large sparse solve",
]
