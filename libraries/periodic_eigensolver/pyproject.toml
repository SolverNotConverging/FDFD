[build-system]
requires = ["setuptools>=77", "Cython>=3,<4", "numpy>=1.26,<3", "scipy>=1.12,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "periodic-eigensolver"
version = "1.0.0"
description = "periodic eigensolver for computational electromagnetics"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools.ext-modules]]
name = "periodic_eigensolver._cython_kernels"
sources = ["src/periodic_eigensolver/_cython_kernels.pyx"]
optional = true
