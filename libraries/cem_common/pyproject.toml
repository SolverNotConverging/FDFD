[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-common"
version = "1.0.0"
description = "Shared materials, geometry, results, and lifecycle contracts for Computational Electromagnetics"
requires-python = ">=3.10"
license = "MIT"
readme = "README.rst"
dependencies = ["numpy>=1.26,<3", "h5py>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]
