[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-adaptivity"
version = "0.1.0"
description = "Shared adaptive solve controls and electromagnetic residual estimators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scikit-fem>=12,<13"]

[tool.setuptools]
packages = ["fem_adaptivity"]
package-dir = {fem_adaptivity = "."}
