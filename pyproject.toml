[build-system]
requires = [
  "setuptools>=77,<83",
  "Cython>=3,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]
build-backend = "setuptools.build_meta"

[project]
name = "fdfd"
version = "1.1.0"
description = "FDFD electromagnetic solvers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4",
  "h5py>=3.15,<4",
  "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/SolverNotConverging/FDFD"
Releases = "https://github.com/SolverNotConverging/FDFD/releases"

[project.optional-dependencies]
test = ["pytest>=8,<10", "docutils"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "docutils",
  "pandas",
]

[project.scripts]
fdfd = "fdfd.__main__:main"

[tool.uv]
package = false
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "setup_cython.py" },
  { file = "**/src/*.py" },
  { file = "**/src/*.pyx" },
]

[tool.setuptools]
include-package-data = false
