[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-waveguide-scattering"
version = "1.0.0"
description = "fem waveguide scattering for computational electromagnetics"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cem-common>=1.0.0,<2", "fem-adaptivity>=1.0.0,<2", "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-fem>=12,<13", "gmsh>=4.13,<5", "h5py>=3.15,<4", "meshio>=5.3,<6", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fem-waveguide-scattering-inspect = "fem_waveguide_scattering.inspect_h5:main"
