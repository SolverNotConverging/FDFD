[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fdfd-waveguide-modes"
version = "1.0.0"
description = "fdfd waveguide modes for computational electromagnetics"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cem-common>=1.0.0,<2", "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
examples = ["pandas>=2,<4", "tqdm>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
