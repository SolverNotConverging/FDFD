[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-electrostatic-solver"
version = "1.0.0"
description = "Geometry-first 1D/2D electrostatic finite-element solver"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-fem>=12,<13",
    "gmsh>=4.13,<5",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["Electrostatic_Solver"]
package-dir = {Electrostatic_Solver = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gmsh: test requiring the Gmsh runtime"]
