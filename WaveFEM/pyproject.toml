[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefem"
version = "0.0.1"
description = "Full-vector 2.5D Maxwell FEM waveguide-scattering solver"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "WaveFEM contributors" },
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-fem>=12,<13",
    "gmsh>=4.13,<5",
    "h5py>=3.15,<4",
    "meshio>=5.3,<6",
    "matplotlib>=3.8,<4",
]

[project.scripts]
wavefem-inspect-h5 = "wavefem.inspect_h5:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: convergence test or comparatively large sparse solve",
    "gmsh: test requiring the Gmsh runtime",
]
