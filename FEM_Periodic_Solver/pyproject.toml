[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-periodic-solver"
version = "0.1.0"
description = "Fixed-frequency finite-element solvers for periodic electromagnetic structures"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fem-adaptivity>=0.1.0",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-fem>=12,<13",
    "gmsh>=4.13,<5",
    "h5py>=3.10,<4",
    "matplotlib>=3.8,<4",
    "periodic-eigensolver>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fem-periodic-inspect-h5 = "FEM_Periodic_Solver.inspect_h5:main"

[tool.setuptools]
packages = ["FEM_Periodic_Solver", "FEM_Periodic_Solver.examples"]
package-dir = {FEM_Periodic_Solver = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gmsh: test requiring the Gmsh runtime",
    "slow: convergence or performance test",
]
